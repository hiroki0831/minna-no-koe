<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172a44"><title>みんなの声｜メンバー承認</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#172a44;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#172a44;color:white;padding:17px 18px;font-size:21px;font-weight:700}main{max-width:750px;margin:auto;padding:18px}.card{background:white;padding:22px;border-radius:18px;box-shadow:0 3px 15px #1327440b;margin:0 0 15px}label{display:block;font-weight:650;margin:14px 0 6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button,.button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:#2466cc;color:white;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55}.secondary{background:#e7edf5;color:#24384f}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.item{padding:14px 0;border-top:1px solid #e2e8f0;display:flex;gap:12px;align-items:start}.item input{width:22px;height:22px;flex:none}.muted{color:#617084;font-size:14px}.error{color:#b42318}.success{color:#127345}.hidden{display:none}#message{margin:16px 0}a{color:#2466cc}small{overflow-wrap:anywhere}
</style></head><body><header>🎙 みんなの声｜メンバー承認</header><main><div id="message" role="status" aria-live="polite"></div>
<section id="needLogin" class="card hidden"><h2>管理者としてログイン</h2><p>みんなの声にログインしてから、このページを開いてください。</p><a class="button" href="./">アプリでログイン</a></section>
<section id="noAdmin" class="card hidden"><h2>管理者の権限がありません</h2><p>承認操作は各組織の管理者だけが利用できます。</p><a href="./">アプリへ戻る</a></section>
<section id="main" class="hidden"><div class="card"><h2>承認待ちメンバー</h2><label for="org">承認する組織</label><select id="org"></select><p class="muted">メール認証が済んだ申請だけを表示します。表示された組織の申請だけを承認できます。</p><div class="row"><button id="reload" type="button" class="secondary">一覧を更新</button><span id="count" class="muted"></span></div><div id="requests"></div><div class="row"><button id="all" type="button" class="secondary">すべて選択</button><button id="approve" type="button" disabled>選択した0人を承認</button></div></div><p><a href="./">← みんなの声に戻る</a></p></section></main>
<script src="./config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id),cfg=window.APP_CONFIG||{};let sb,requests=[],busy=false;
function msg(s,err=false){$('message').textContent=s;$('message').className=err?'error':'success'}
function show(id,yes){$(id).classList.toggle('hidden',!yes)}
function selected(){return [...document.querySelectorAll('#requests input[type="checkbox"]:checked')].map(x=>x.value)}
function updateSelection(){$('approve').disabled=busy||!selected().length;$('approve').textContent='選択した'+selected().length+'人を承認'}
async function load(){const org=$('org').value;const box=$('requests');box.replaceChildren();$('count').textContent='読み込み中…';$('approve').disabled=true;if(!org)return;
const {data,error}=await sb.rpc('get_pending_join_requests',{p_org_id:org});if(org!==$('org').value)return;if(error){msg('承認待ちの取得に失敗: '+error.message,true);$('count').textContent='';return}requests=data||[];$('count').textContent=requests.length+'人';if(!requests.length){const p=document.createElement('p');p.className='muted';p.textContent='メール確認済みの承認待ち申請はありません。';box.append(p)}for(const r of requests){const label=document.createElement('label');label.className='item';const check=document.createElement('input');check.type='checkbox';check.value=r.id;check.setAttribute('aria-label',r.display_name+'を承認');check.onchange=updateSelection;const info=document.createElement('div');const name=document.createElement('strong');name.textContent=r.display_name;const email=document.createElement('small');email.className='muted';email.textContent=r.email||'';const date=document.createElement('small');date.className='muted';date.textContent='申請: '+new Date(r.created_at).toLocaleDateString('ja-JP');info.append(name,document.createElement('br'),email,document.createElement('br'),date);label.append(check,info);box.append(label)}updateSelection()}
async function start(){if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR_')||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_')){msg('config.js が未設定です。',true);return}
sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await sb.auth.getSession();if(!session){show('needLogin',true);return}
const {data,error}=await sb.from('memberships').select('org_id,role,organizations(id,name)').eq('user_id',session.user.id).eq('role','admin');if(error){msg('管理権限の取得に失敗: '+error.message,true);return}const orgs=(data||[]).filter(m=>m.organizations);if(!orgs.length){show('noAdmin',true);return}
show('main',true);$('org').replaceChildren(...orgs.map(m=>{const o=document.createElement('option');o.value=m.org_id;o.textContent=m.organizations.name;return o}));$('org').onchange=load;$('reload').onclick=load;$('all').onclick=()=>{document.querySelectorAll('#requests input[type="checkbox"]').forEach(x=>{x.checked=true});updateSelection()};
$('approve').onclick=async()=>{const ids=selected(),org=$('org').value,orgName=$('org').selectedOptions[0]?.textContent||'この組織';if(!ids.length)return;if(!confirm(orgName+'の'+ids.length+'人を一括承認しますか？'))return;busy=true;updateSelection();try{const {data,error}=await sb.rpc('approve_join_requests',{p_org_id:org,p_request_ids:ids});if(error){msg('承認できませんでした: '+error.message,true)}else{msg(data+'人を承認しました。');await load()}}finally{busy=false;updateSelection()}};await load()}
start().catch(e=>msg('読み込みに失敗: '+e.message,true));
</script></body></html>
