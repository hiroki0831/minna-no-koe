<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172a44"><title>みんなの声｜参加申請</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#172a44;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#172a44;color:white;padding:17px 18px;font-size:21px;font-weight:700}main{max-width:700px;margin:auto;padding:18px}.card{background:white;padding:22px;border-radius:18px;box-shadow:0 3px 15px #1327440b;margin:0 0 15px}label{display:block;font-weight:650;margin:14px 0 6px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button,.button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:#2466cc;color:white;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55}a{color:#2466cc}.muted{color:#617084;font-size:14px}.error{color:#b42318}.success{color:#127345}.hidden{display:none}.item{border-top:1px solid #e2e8f0;padding:12px 0}#message{margin:16px 0}
</style></head><body><header>🎙 みんなの声｜参加申請</header><main><div id="message" role="status" aria-live="polite"></div>
<section id="needLogin" class="card hidden"><h2>まずアカウント登録・ログイン</h2><p>アプリの「新規登録」からメール認証を済ませ、ログイン後にもう一度このページへ戻ってください。</p><a class="button" href="./">アプリで新規登録・ログイン</a></section>
<section id="main" class="hidden"><div class="card"><h2>所属先に参加申請</h2><p class="muted">会社と倫理法人会は別々に承認されます。どちらかを選び、管理者による承認を待ってください。</p><label for="displayName">お名前（管理者に表示）</label><input id="displayName" maxlength="80" autocomplete="name" placeholder="例：山田 太郎" required><label for="org">参加したい組織</label><select id="org"></select><p><button id="request">参加を申請する</button></p></div>
<div class="card"><h2>自分の申請状況</h2><div id="myRequests" class="muted">読み込み中…</div><p><button id="reload" type="button">更新</button></p></div><p><a href="./">← みんなの声に戻る</a></p></section></main>
<script src="./config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id), cfg=window.APP_CONFIG||{};
function msg(s,err=false){$('message').textContent=s;$('message').className=err?'error':'success'}
function show(id,yes){$(id).classList.toggle('hidden',!yes)}
const statuses={pending:'承認待ち',approved:'承認済み',rejected:'却下'};
async function start(){if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR_')||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_')){msg('config.js が未設定です。',true);return}
const sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
const {data:{session}}=await sb.auth.getSession();if(!session){show('needLogin',true);return}
show('main',true);
const {data:orgs,error:orgError}=await sb.from('organizations').select('id,name').order('name');if(orgError){msg('組織一覧を取得できません: '+orgError.message,true);return}
$('org').replaceChildren(...(orgs||[]).map(o=>{const option=document.createElement('option');option.value=o.id;option.textContent=o.name;return option}));
async function reload(){const {data,error}=await sb.from('join_requests').select('org_id,display_name,status,created_at,organizations(name)').eq('user_id',session.user.id).order('created_at',{ascending:false});const target=$('myRequests');target.replaceChildren();if(error){msg('申請の確認に失敗: '+error.message,true);return}if(!data?.length){target.textContent='申請はまだありません。';return}for(const r of data){const line=document.createElement('div');line.className='item';const org=r.organizations?.name||'組織';line.textContent=org+' ｜ '+(statuses[r.status]||r.status)+' ｜ '+new Date(r.created_at).toLocaleDateString('ja-JP');target.append(line)}}
$('reload').onclick=reload;
$('request').onclick=async()=>{const name=$('displayName').value.trim(),org=$('org').value;if(!name||name.length>80||!org){msg('名前と組織を指定してください。',true);return}const button=$('request');button.disabled=true;try{const {error}=await sb.from('join_requests').insert({user_id:session.user.id,org_id:org,display_name:name});if(error){if(error.code==='23505'){msg('この組織への申請はすでにあります。下の申請状況を確認してください。',true)}else{msg('申請できませんでした: '+error.message,true)}}else{msg('申請を受け付けました。管理者の承認をお待ちください。');await reload()}}finally{button.disabled=false}};
await reload()}
start().catch(e=>msg('読み込みに失敗: '+e.message,true));
</script></body></html>
